<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI CV Analyzer & Profiler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-glass shadow-sm py-3 sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
      <span>✨ AI CV Analyzer</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-2 align-items-center mt-2 mt-lg-0">
        <li class="nav-item">
          <a class="nav-link py-2 px-3 rounded" href="/">Analyze CVs</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-primary btn-sm px-4 py-2 rounded-pill" href="/ranking">Global Rankings</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-5 animate-fade-in">
  <div class="card card-app shadow p-4 p-md-5">
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
